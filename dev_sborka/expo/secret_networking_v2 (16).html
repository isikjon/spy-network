// PROBABILITY ENGINE
// ══════════════════════════════════════════════════════
function buildAdj(){
  const adj={'me':[]};
  S.contacts.forEach(c=>{
    adj[c.id]=[];
    adj['me'].push({id:c.id,type:'me',label:lv(c.level).l});
    adj[c.id].push({id:'me',type:'me',label:lv(c.level).l});
  });
  (S.conns||[]).forEach(cn=>{
    (adj[cn.from]=adj[cn.from]||[]).push({id:cn.to,type:'manual',label:cn.label||'связь'});
    (adj[cn.to]=adj[cn.to]||[]).push({id:cn.from,type:'manual',label:cn.label||'связь'});
  });
  S.goals.forEach(g=>{
    const cs=g.contacts||[];
    for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){
      (adj[cs[i]]=adj[cs[i]]||[]).push({id:cs[j],type:'goal',label:g.title});
      (adj[cs[j]]=adj[cs[j]]||[]).push({id:cs[i],type:'goal',label:g.title});
    }
  });
  return adj;
}

function findPaths(fromId,toId,maxPaths=4){
  if(fromId===toId)return[];
  const adj=buildAdj();
  const results=[];
  const queue=[[fromId,[{id:fromId,edge:null}]]];
  const seen=new Set();
  while(queue.length&&results.length<maxPaths){
    const[cur,path]=queue.shift();
    const key=path.map(p=>p.id).join('>');
    if(seen.has(key))continue;seen.add(key);
    if(cur===toId&&path.length>1){results.push(path);continue;}
    if(path.length>=7)continue;
    for(const nb of(adj[cur]||[])){
      if(!path.some(p=>p.id===nb.id))
        queue.push([nb.id,[...path,{id:nb.id,edge:nb}]]);
    }
  }
  return results;
}

function edgeStrength(aId,bId){
  if(aId==='me'||bId==='me'){
    const cId=aId==='me'?bId:aId;
    const c=S.contacts.find(x=>x.id===cId);
    if(!c)return 0.1;
    return Math.min(c.trust/100*0.65+c.level/5*0.35,1);
  }
  const a=S.contacts.find(c=>c.id===aId),b=S.contacts.find(c=>c.id===bId);
  if(!a||!b)return 0.2;
  const avgTrust=(a.trust+b.trust)/200;
  const lvBonus=Math.min(a.level,b.level)/5*0.25;
  const hasManual=(S.conns||[]).some(cn=>(cn.from===aId&&cn.to===bId)||(cn.to===aId&&cn.from===bId));
  return Math.min(avgTrust+lvBonus+(hasManual?0.15:0),1);
}

function pathScore(path){
  if(!path||path.length<2)return 0;
  let prod=1;
  for(let i=0;i<path.length-1;i++)prod*=edgeStrength(path[i].id,path[i+1].id);
  return Math.min(prod/Math.sqrt(path.length-1),1);
}

function calcUpgrade(c){
  if(c.level>=5)return{up:null,down:calcDowngradeRisk(c)};
  const nextThresh=[0,25,45,62,78,92][Math.min(c.level+1,5)];
  const trustRatio=Math.min(c.trust/nextThresh,1.5);
  const days=c.lastContact?Math.ceil((Date.now()-new Date(c.lastContact))/864e5):999;
  const recency=Math.exp(-days/90);
  const goals=S.goals.filter(g=>(g.contacts||[]).includes(c.id)).length;
  const goalF=Math.min(goals/2,1);
  const actionF=(c.nextAction&&c.nextDate&&c.nextDate>=tod())?1:0;
  const z=0.40*Math.min(trustRatio,1)+0.30*recency+0.20*goalF+0.10*actionF;
  const p=1/(1+Math.exp(-8*(z-0.5)));
  return{up:Math.round(p*100),down:calcDowngradeRisk(c),trustRatio:Math.round(trustRatio*100),recency:Math.round(recency*100),goalF:Math.round(goalF*100),actionF,days,z:Math.round(z*100)};
}

function calcDowngradeRisk(c){
  const days=c.lastContact?Math.ceil((Date.now()-new Date(c.lastContact))/864e5):365;
  const decayRate=Math.max(120-c.level*15,30);
  return Math.round((1-Math.exp(-days/decayRate))*100*0.7);
}

function calcCentrality(){
  const scores={};
  S.contacts.forEach(c=>scores[c.id]=0);
  const ids=S.contacts.map(c=>c.id);
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    const paths=findPaths(ids[i],ids[j],1);
    if(paths[0])paths[0].slice(1,-1).forEach(n=>{if(scores[n.id]!==undefined)scores[n.id]++;});
  }
  return scores;
}

function socialCapital(c,cs){
  const degree=(S.conns||[]).filter(cn=>cn.from===c.id||cn.to===c.id).length+S.goals.filter(g=>(g.contacts||[]).includes(c.id)).length;
  const bc=cs[c.id]||0,maxBC=Math.max(...Object.values(cs),1);
  return Math.round((c.trust/100*35)+(c.level/5*30)+(degree/Math.max(S.contacts.length-1,1)*20)+(bc/maxBC*15));
}

  }

  if(sg.length)hints.push({icon:'🎯',text:`Вы связаны общей целью «${sg[0].title}» — используйте это как повод для контакта`,color:'#1e3a5f',bg:'#0f172a'});
  else hints.push({icon:'💭',text:`Добавьте ${fname(target.name)} в стратегическую цель — это создаст контекст для сближения`,color:'#334155',bg:'#0f172a'});
  return hints;

// MARKOV CHAIN ENGINE
// 6 состояний: 0=потерян, 1-5=уровни отношений
// T[s→s'] = P(переход за 1 месяц)
// ══════════════════════════════════════════════════════
function getMonthlyTrans(c,overrideLevel){
  const L=overrideLevel!==undefined?overrideLevel:c.level;
  const u=calcUpgrade({...c,level:L});
  const pUpAnnual=(u.up!==null?u.up/100:0)*0.45;
  const pUp=L<5?Math.min(1-Math.pow(Math.max(1-pUpAnnual,0.001),1/12),0.08):0;
  const pDownAnnual=u.down/100*0.30;
  const pDown=L>1?Math.min(1-Math.pow(Math.max(1-pDownAnnual,0.001),1/12),0.06):0;
  const pLost=L===1?0.012:L===2?0.004:0.001;
  const pStay=Math.max(1-pUp-pDown-pLost,0.5);
  const total=pUp+pDown+pLost+pStay;
  return{pUp:pUp/total,pDown:pDown/total,pLost:pLost/total,pStay:pStay/total};
}

function predictStates(c,months){
  let v=Array(6).fill(0);
  v[Math.max(1,Math.min(5,c.level))]=1;
  for(let m=0;m<months;m++){
    const nv=Array(6).fill(0);
    nv[0]+=v[0];
    for(let s=1;s<=5;s++){
      if(v[s]<0.00001)continue;
      const{pUp,pDown,pLost,pStay}=getMonthlyTrans(c,s);
      nv[s]+=v[s]*pStay;
      if(s<5)nv[s+1]+=v[s]*pUp;else nv[5]+=v[s]*pUp;
      if(s>1)nv[s-1]+=v[s]*pDown;else nv[1]+=v[s]*pDown;
      nv[0]+=v[s]*pLost;
    }
    v=nv;
  }
  return v;
}

function expLevel(v){return v.slice(1).reduce((s,p,i)=>s+p*(i+1),0).toFixed(1);}
function steadyState(c){return predictStates(c,24);}

function monthsToLevel(c,targetL){
  if(c.level===targetL)return 0;
  if(targetL<c.level)return null;
  for(let m=1;m<=36;m++){
    if(predictStates(c,m)[targetL]>=0.35)return m;
  }
  return null;
}

// Compute degree (connection count) for each contact node
function nodeDegree(cid){
  let d=0;
  (S.conns||[]).forEach(cn=>{if(cn.from===cid||cn.to===cid)d++;});
  S.goals.forEach(g=>{if((g.contacts||[]).includes(cid))d++;});
  return d;
}

// Score existing network contacts as likely bridges to a target
function scoreBridges(target){
  const tOrg=(target.org||'').toLowerCase();
  const tRole=(target.role||'').toLowerCase();
  const tInd=(target.targetIndustry||'').toLowerCase();
  const tCity=(target.targetCity||'').toLowerCase();
  const tAssoc=(target.targetAssociates||'').toLowerCase();
  const tVenues=(target.targetVenues||'').toLowerCase();

  return S.contacts.filter(c=>c.id!==target.id&&!c.isTarget&&c.level>0).map(c=>{
    let score=0;
    const cOrg=(c.org||'').toLowerCase();
    const cRole=(c.role||'').toLowerCase();
    const cNotes=(c.notes||'').toLowerCase();

    // Org/company match
    const tOrgWords=tOrg.split(/\s+/).filter(w=>w.length>3);
    tOrgWords.forEach(w=>{if(cOrg.includes(w)||cNotes.includes(w))score+=18;});

    // Industry/role keywords
    const tIndWords=tInd.split(/[\s,;]+/).filter(w=>w.length>2);
    tIndWords.forEach(w=>{if(cOrg.includes(w)||cRole.includes(w)||cNotes.includes(w))score+=14;});

    // Role similarity
    const tRoleWords=tRole.split(/\s+/).filter(w=>w.length>4);
    tRoleWords.forEach(w=>{if(cRole.includes(w)||cOrg.includes(w))score+=8;});

    // Known associates — strong signal
    if(tAssoc){
      const aWords=tAssoc.split(/[\s,;]+/).filter(w=>w.length>4);
      aWords.forEach(w=>{if(cNotes.includes(w)||c.name.toLowerCase().includes(w))score+=35;});
    }

    // City
    if(tCity&&tCity.length>2){
      if(cOrg.includes(tCity)||cNotes.includes(tCity))score+=12;
    }

    // Venues/events
    if(tVenues){
      const vWords=tVenues.split(/[\s,;]+/).filter(w=>w.length>3);
      vWords.forEach(w=>{if(cNotes.includes(w)||cOrg.includes(w))score+=10;});
    }

    // Degree: well-connected = better bridge
    const deg=nodeDegree(c.id);
    score=Math.round(score*(1+Math.min(deg,6)*0.1));
    // Trust multiplier
    score=Math.round(score*(0.55+c.trust/250));
    // Level multiplier
    score=Math.round(score*(0.65+c.level*0.09));

    return{...c,score:Math.min(98,Math.max(1,score))};
  }).filter(c=>c.score>3).sort((a,b)=>b.score-a.score);
}

function startNet(){
  _pan={x:0,y:0};_zoom=1;_drag=null;_hoverNode=null;
  setTimeout(()=>{
    const wrap=document.getElementById('net-canvas-wrap');if(!wrap)return;
    const W=wrap.clientWidth,H=wrap.clientHeight||420;
    if(!W)return;
    const dpr=window.devicePixelRatio||1;
    const cv=document.createElement('canvas');
    cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';cv.style.display='block';cv.style.cursor='grab';
    wrap.innerHTML='';wrap.appendChild(cv);
    const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const cx=W/2,cy=H/2;
    const maxR=Math.min(W,H)/2-42;

    // ── DEGREE ────────────────────────────────
    const maxDeg=Math.max(...S.contacts.map(c=>nodeDegree(c.id)),1);
    function nodeR(c){return Math.round(Math.max(11,11+nodeDegree(c.id)/maxDeg*11+(c.trust/100)*4));}

    // ── RING RADII (anti-overlap) ──────────────
    const byLevel={1:[],2:[],3:[],4:[],5:[]};
    // Only show contacts passing current filter
    S.contacts.filter(c=>nfVisible(c)&&!c.isTarget).forEach(c=>(byLevel[c.level]=byLevel[c.level]||[]).push(c));
    function minRingR(lvl,prevR){
      const ring=byLevel[lvl]||[];if(!ring.length)return prevR+40;
      const maxNR=Math.max(...ring.map(c=>nodeR(c)));
      const circum=ring.length*(2*maxNR+12);
      return Math.max(prevR+42,circum/(2*Math.PI));
    }
    let r5=Math.max(44,minRingR(5,0));
    let r4=minRingR(4,r5);
    let r3=minRingR(3,r4);
    let r2=minRingR(2,r3);
    let r1=minRingR(1,r2);
    // Scale to fit canvas
    const sc=Math.min(1,maxR/Math.max(r1,1));
    const RADII={5:r5*sc,4:r4*sc,3:r3*sc,2:r2*sc,1:r1*sc};
    const LEVEL_COLOR={5:'#059669',4:'#d97706',3:'#7c3aed',2:'#2563eb',1:'#64748b'};

    // ── PURE GEOMETRIC NODE PLACEMENT ─────────
    // Group contacts by level, sort by degree desc (most-connected first, then clockwise)
    // Saved positions: stored as fractions of canvas (0..1) relative to center
    const netPos=S.netPos||{};
    function savedXY(id){
      const p=netPos[String(id)];
      if(!p)return null;
      return{x:cx+p.fx*W, y:cy+p.fy*H};
    }
    function placeRing(lvl){
      const ring=[...byLevel[lvl]||[]].sort((a,b)=>nodeDegree(b.id)-nodeDegree(a.id));
      const r=RADII[lvl];
      const offset=lvl%2===0?Math.PI/Math.max(ring.length,1)/2:0;
      return ring.map((c,i)=>{
        const angle=ring.length===1?-Math.PI/2:(i/ring.length)*Math.PI*2-Math.PI/2+offset;
        const ll=lv(c.level);
        const saved=savedXY(c.id);
        const nx=saved?saved.x:cx+Math.cos(angle)*r;
        const ny=saved?saved.y:cy+Math.sin(angle)*r;
        return{id:c.id,x:nx,y:ny,r:nodeR(c),
          color:ll.c,ini:ini(c.name),fname:fname(c.name),angle,ringR:r,isMe:false};
      });
    }
    const savedMe=savedXY('me');
    const meN={id:'me',x:savedMe?savedMe.x:cx,y:savedMe?savedMe.y:cy,r:20,color:'#d97706',ini:ini(S.me&&S.me.name?S.me.name:'Я'),fname:(S.me&&S.me.name?meName():'Я'),isMe:true};
    _netNodes=[meN,...placeRing(5),...placeRing(4),...placeRing(3),...placeRing(2),...placeRing(1)];

    // ── TARGET NODES: placed on outer ring AFTER scale calc ──
    const targetContacts=S.contacts.filter(c=>c.isTarget&&nfVisible(c));
    if(targetContacts.length){
      const tR=RADII[1]+52; // always beyond level-1 ring
      targetContacts.forEach(function(c,i){
        const angle=targetContacts.length===1?-Math.PI/2:(i/targetContacts.length)*Math.PI*2-Math.PI/2;
        const saved=savedXY(c.id);
        const tx=saved?saved.x:cx+Math.cos(angle)*tR;
        const ty=saved?saved.y:cy+Math.sin(angle)*tR;
        _netNodes.push({id:c.id,x:tx,y:ty,r:14,color:'#ef4444',ini:'🎯',fname:fname(c.name),
          angle:angle,ringR:tR,isMe:false,isTarget:true});
      });
    }

    // Helper: persist all node positions to S.netPos and save
    function saveNodePositions(){
      S.netPos={};
      _netNodes.forEach(n=>{
        S.netPos[String(n.id)]={fx:(n.x-cx)/W, fy:(n.y-cy)/H};
      });
      save();
    }
    _netSteps=9999; // no physics

    // ── EDGES ─────────────────────────────────
    _netEdges=[];
    S.contacts.filter(c=>nfVisible(c)).forEach(c=>{_netEdges.push({from:'me',to:c.id,meEdge:true,lvl:c.level});});
    S.goals.forEach(g=>{
      const cs=g.contacts||[];
      for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++)
        _netEdges.push({from:cs[i],to:cs[j],label:(g.title||'').slice(0,10),dash:true,meEdge:false});
    });
    (S.conns||[]).forEach(cn=>_netEdges.push({from:cn.from,to:cn.to,label:(cn.label||'').slice(0,10),dash:false,meEdge:false}));
    _netRunning=true;

    // ── TOOLTIP ───────────────────────────────
    function drawTooltip(n,mx,my){
      if(!n||n.isMe)return;
      const c=S.contacts.find(x=>x.id===n.id);if(!c)return;
      const l=lv(c.level);
      const lines=[c.name,l.l+' · 💙'+c.trust+'%',c.org||'',c.nextAction?'⚡ '+c.nextAction.slice(0,26):''].filter(Boolean);
      ctx.font='11px sans-serif';
      const tw=Math.max(...lines.map((t,i)=>{ctx.font=i===0?'bold 12px sans-serif':'11px sans-serif';return ctx.measureText(t).width;}));
      const pad=10,lh=16,bw=tw+pad*2,bh=lines.length*lh+pad*2;
      let tx=mx+14,ty=my-bh/2;
      if(tx+bw>W-4)tx=mx-bw-10;if(ty<4)ty=4;if(ty+bh>H-4)ty=H-bh-4;
      ctx.shadowColor='rgba(0,0,0,.75)';ctx.shadowBlur=16;
      ctx.fillStyle='#1e293b';
      if(ctx.roundRect)ctx.roundRect(tx,ty,bw,bh,8);else ctx.rect(tx,ty,bw,bh);
      ctx.fill();ctx.shadowBlur=0;
      ctx.strokeStyle=l.c+'99';ctx.lineWidth=1.5;ctx.stroke();
      lines.forEach((t,i)=>{
        ctx.fillStyle=i===0?'#e2e8f0':i===1?l.c:'#94a3b8';
        ctx.font=i===0?'bold 12px sans-serif':'11px sans-serif';
        ctx.textAlign='left';ctx.textBaseline='top';
        ctx.fillText(t,tx+pad,ty+pad+i*lh);
      });
    }

    // ── DRAW ──────────────────────────────────
    const ringDefs=[
      {r:RADII[5],l:'Союзники',c:LEVEL_COLOR[5]},
      {r:RADII[4],l:'Доверенные',c:LEVEL_COLOR[4]},
      {r:RADII[3],l:'Полезные',c:LEVEL_COLOR[3]},
      {r:RADII[2],l:'Контакты',c:LEVEL_COLOR[2]},
      {r:RADII[1],l:'Знакомые',c:LEVEL_COLOR[1]},
    ];

    function drw(mouseX,mouseY){
      ctx.clearRect(0,0,W,H);
      ctx.save();
      ctx.translate(cx+_pan.x,cy+_pan.y);ctx.scale(_zoom,_zoom);ctx.translate(-cx,-cy);

      // ── RING DECORATIONS ────────────────────
      if(_netView==='circles'){
        // Donut bands
        for(let i=ringDefs.length-1;i>=0;i--){
          const rd=ringDefs[i];
          const inner=i===0?0:(ringDefs[i-1].r+rd.r)/2;
          const outer=i===ringDefs.length-1?rd.r+36:(rd.r+ringDefs[i+1].r)/2;
          ctx.beginPath();ctx.arc(cx,cy,outer,0,Math.PI*2,false);
          if(inner>0){ctx.arc(cx,cy,inner,0,Math.PI*2,true);}
          ctx.fillStyle=rd.c+'11';ctx.fill();
        }
        ringDefs.forEach((rd,i)=>{
          ctx.beginPath();ctx.arc(cx,cy,rd.r,0,Math.PI*2);
          ctx.strokeStyle=rd.c+'66';ctx.lineWidth=1.2;ctx.setLineDash([5,7]);ctx.stroke();ctx.setLineDash([]);
          // Label badge at top-right of each ring
          const ang=-Math.PI*0.28;
          const lx=cx+Math.cos(ang)*rd.r,ly=cy+Math.sin(ang)*rd.r;
          ctx.font='bold 8.5px sans-serif';
          const tw2=ctx.measureText(rd.l).width;
          ctx.fillStyle='#080d1a';
          if(ctx.roundRect)ctx.roundRect(lx-tw2/2-5,ly-7,tw2+10,14,3);
          else ctx.rect(lx-tw2/2-5,ly-7,tw2+10,14);
          ctx.fill();
          ctx.fillStyle=rd.c+'DD';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(rd.l,lx,ly);
        });
      } else {
        // Subtle ring guides only
        ringDefs.forEach(rd=>{
          ctx.beginPath();ctx.arc(cx,cy,rd.r,0,Math.PI*2);
          ctx.strokeStyle=rd.c+'12';ctx.lineWidth=0.7;ctx.setLineDash([2,10]);ctx.stroke();ctx.setLineDash([]);
        });
      }
      // Target orbit ring (if any targets visible)
      if(S.contacts.some(function(c){return c.isTarget&&nfVisible(c);})){
        var tRingR=RADII[1]+52;
        var pulse2=0.5+0.5*Math.sin(Date.now()/900);
        ctx.beginPath();ctx.arc(cx,cy,tRingR,0,Math.PI*2);
        ctx.strokeStyle='#ef4444'+(Math.round(0x0a+pulse2*0x14).toString(16).padStart(2,'0'));
        ctx.lineWidth=0.8;ctx.setLineDash([4,10]);ctx.stroke();ctx.setLineDash([]);
      }

      // ── ME EDGES: owner → contact (all levels, drawn behind everything) ──
      const meNode=_netNodes.find(n=>n.isMe);
      if(meNode){
        _netEdges.filter(e=>e.meEdge).forEach(e=>{
          const other=_netNodes.find(n=>n.id===(e.from==='me'?e.to:e.from));if(!other)return;
          const c2=S.contacts.find(x=>x.id===other.id);if(!c2)return;
          const hi=_highlight.edges.some(h=>(h.from===e.from&&h.to===e.to)||(h.from===e.to&&h.to===e.from));
          if(c2.isTarget){ctx.beginPath();ctx.moveTo(meNode.x,meNode.y);ctx.lineTo(other.x,other.y);ctx.strokeStyle='#ef444430';ctx.lineWidth=0.8;ctx.setLineDash([3,8]);ctx.stroke();ctx.setLineDash([]);return;}
          const alpha=hi?'FF':c2.level>=5?'CC':c2.level>=4?'99':c2.level>=3?'55':c2.level>=2?'30':'18';
          const lw=hi?2.5:c2.level>=4?1.5:c2.level>=3?1:0.7;
          const dash=c2.level>=3||hi?[]:[6,7];
          ctx.beginPath();ctx.moveTo(meNode.x,meNode.y);ctx.lineTo(other.x,other.y);
          ctx.strokeStyle=(hi?'#818cf8':'#d97806')+alpha;
          ctx.lineWidth=lw;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([]);
        });
      }

      // ── BRIDGE EDGES: target → top bridges ──
      _netNodes.filter(function(n){return n.isTarget;}).forEach(function(tn){
        var tc=S.contacts.find(function(x){return x.id===tn.id;});if(!tc)return;
        var bridges=scoreBridges(tc).slice(0,3);
        bridges.forEach(function(b){
          var bn=_netNodes.find(function(n){return n.id===b.id;});if(!bn)return;
          var alpha=Math.round(0x25+b.score/100*0x55).toString(16).padStart(2,'0');
          ctx.beginPath();ctx.moveTo(tn.x,tn.y);ctx.lineTo(bn.x,bn.y);
          ctx.strokeStyle='#ef4444'+alpha;ctx.lineWidth=1;ctx.setLineDash([3,5]);ctx.stroke();ctx.setLineDash([]);
          var mx2=(tn.x+bn.x)/2,my2=(tn.y+bn.y)/2;
          ctx.fillStyle='#ef444490';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(b.score+'%',mx2,my2-5);
        });
      });

      // ── CONTACT EDGES (manual connections + goals) ──
      _netEdges.forEach(e=>{
        if(e.meEdge)return;
        const a=_netNodes.find(n=>n.id===e.from),b=_netNodes.find(n=>n.id===e.to);if(!a||!b)return;
        const hi=_highlight.edges.some(h=>(h.from===e.from&&h.to===e.to)||(h.from===e.to&&h.to===e.from));
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
        if(hi){ctx.strokeStyle='#818cf8';ctx.lineWidth=2.5;ctx.setLineDash([]);}
        else if(e.dash){ctx.strokeStyle='#33415560';ctx.lineWidth=1;ctx.setLineDash([4,5]);}
        else{ctx.strokeStyle='#4f46e5BB';ctx.lineWidth=1.5;ctx.setLineDash([]);}
        ctx.stroke();ctx.setLineDash([]);
        if(e.label&&!e.dash&&!hi){ctx.fillStyle='#47556970';ctx.font='8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.label,(a.x+b.x)/2,(a.y+b.y)/2-6);}
      });

      // ── NODES ───────────────────────────────
      _netNodes.forEach(n=>{
        const hi=_highlight.nodes.has(n.id),hov=n===_hoverNode;
        if(n.isMe){
          ctx.beginPath();ctx.arc(n.x,n.y,n.r+13,0,Math.PI*2);ctx.fillStyle='#d9780610';ctx.fill();
          ctx.beginPath();ctx.arc(n.x,n.y,n.r+5,0,Math.PI*2);ctx.fillStyle='#d9780628';ctx.fill();
          ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle='#92400e';ctx.fill();
          ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.stroke();
          ctx.fillStyle='#fef3c7';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.ini,n.x,n.y);
          ctx.fillStyle='#fbbf24';ctx.font='bold 9px sans-serif';ctx.textBaseline='top';ctx.fillText('★ '+n.fname,n.x,n.y+n.r+4);
        } else if(n.isTarget){
          // Pulsing target node
          const pulse=0.5+0.5*Math.sin(Date.now()/700);
          const r2=hov?16:14;
          ctx.beginPath();ctx.arc(n.x,n.y,r2+6+pulse*4,0,Math.PI*2);
          ctx.strokeStyle='#ef4444'+(Math.round(0x18+pulse*0x28).toString(16).padStart(2,'0'));
          ctx.lineWidth=1;ctx.setLineDash([3,4]);ctx.stroke();ctx.setLineDash([]);
          ctx.beginPath();ctx.arc(n.x,n.y,r2,0,Math.PI*2);
          ctx.fillStyle=hov?'#2d0000':'#1a0000';ctx.fill();
          ctx.strokeStyle=hov?'#fff':'#ef4444';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
          ctx.font=(r2>=14?'13':'11')+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('🎯',n.x,n.y);
          ctx.fillStyle=hov?'#fca5a5':'#ef4444';ctx.font='bold 9px sans-serif';ctx.textBaseline='top';
          ctx.fillText(n.fname,n.x,n.y+r2+4);
        } else {
          const sc3=hov?1.13:hi?1.07:1,r2=n.r*sc3;
          if(hov||hi){ctx.beginPath();ctx.arc(n.x,n.y,r2+8,0,Math.PI*2);ctx.fillStyle=n.color+'18';ctx.fill();}
          ctx.beginPath();ctx.arc(n.x,n.y,r2+3,0,Math.PI*2);ctx.fillStyle=n.color+(hov?'38':hi?'25':'0E');ctx.fill();
          ctx.beginPath();ctx.arc(n.x,n.y,r2,0,Math.PI*2);ctx.fillStyle=n.color+(hov?'D5':hi?'95':'60');ctx.fill();
          ctx.strokeStyle=hov?'#fff':hi?'#818cf8':n.color;ctx.lineWidth=hov?2.5:hi?2:1.5;ctx.stroke();
          const fs=Math.min(Math.floor(r2*.65),12);
          ctx.fillStyle='#f1f5f9';ctx.font='bold '+fs+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.ini,n.x,n.y);
          ctx.fillStyle=hov?'#fff':hi?'#c7d2fe':'#7f8ea3';ctx.font=(hov?'bold ':'')+' 9px sans-serif';ctx.textBaseline='top';ctx.fillText(n.fname,n.x,n.y+r2+3);
        }
      });
      ctx.restore();
      if(_hoverNode&&!_hoverNode.isMe&&mouseX!==undefined){
        const sx=(_hoverNode.x-cx)*_zoom+cx+_pan.x,sy=(_hoverNode.y-cy)*_zoom+cy+_pan.y;
        drawTooltip(_hoverNode,sx,sy);
      }
    }

    let _mouseX,_mouseY;
    function loop(){if(!_netRunning)return;drw(_mouseX,_mouseY);_netRAF=requestAnimationFrame(loop);}
    loop();

    function hit(sx,sy){const w=screenToWorld(sx,sy);return _netNodes.find(n=>Math.hypot(n.x-w.x,n.y-w.y)<(n.r+8)/_zoom*1.3);}

    // ── INTERACTION: node-drag vs canvas-pan ──────────
    let _didDrag=false;
    let _dragNode=null;   // node being dragged
    let _panDrag=null;    // canvas pan state

    function screenToWorld(sx,sy){return{x:(sx-cx-_pan.x)/_zoom+cx,y:(sy-cy-_pan.y)/_zoom+cy};}

    cv.addEventListener('mousedown',e=>{
      const r=cv.getBoundingClientRect();
      const mx=e.clientX-r.left,my=e.clientY-r.top;
      const h=hit(mx,my);
      _didDrag=false;
      if(h&&!h.isMe){
        // Start dragging a node
        _dragNode=h;
        _hoverNode=h;
        cv.style.cursor='grabbing';
      } else {
        // Start panning canvas
        _panDrag={sx:mx,sy:my,px:_pan.x,py:_pan.y};
        cv.style.cursor='grabbing';
      }
    });

    cv.addEventListener('mousemove',e=>{
      const r=cv.getBoundingClientRect();
      const mx=e.clientX-r.left,my=e.clientY-r.top;
      _mouseX=mx;_mouseY=my;
      if(_dragNode){
        // Move node in world coordinates
        const w=screenToWorld(mx,my);
        _dragNode.x=w.x;_dragNode.y=w.y;
        _didDrag=true;
        cv.style.cursor='grabbing';
      } else if(_panDrag){
        const dx=mx-_panDrag.sx,dy=my-_panDrag.sy;
        if(Math.abs(dx)>2||Math.abs(dy)>2)_didDrag=true;
        _pan.x=_panDrag.px+dx;_pan.y=_panDrag.py+dy;
      } else {
        const h=hit(mx,my);
        _hoverNode=h||null;
        cv.style.cursor=h?'grab':'grab';
      }
    });

    cv.addEventListener('mouseup',e=>{
      const r=cv.getBoundingClientRect();
      if(_dragNode){
        if(!_didDrag){
          // Tap without drag → open contact
          ocid=_dragNode.id;goTab('contacts');
        } else {
          // Drag ended — persist new position
          saveNodePositions();
        }
        _dragNode=null;
      } else if(_panDrag){
        _panDrag=null;
      }
      _didDrag=false;
      const h=hit(e.clientX-r.left,e.clientY-r.top);
      cv.style.cursor=h?'grab':'grab';
    });

    cv.addEventListener('mouseleave',()=>{
      if(_dragNode&&_didDrag)saveNodePositions();
      _dragNode=null;_panDrag=null;_hoverNode=null;_didDrag=false;
      cv.style.cursor='grab';
    });

    cv.addEventListener('wheel',e=>{
      e.preventDefault();
      const r=cv.getBoundingClientRect();
      const mx=e.clientX-r.left,my=e.clientY-r.top;
      const f=e.deltaY<0?1.12:0.89;
      const nz=Math.min(4,Math.max(0.25,_zoom*f));
      _pan.x=(mx-cx)-(mx-cx-_pan.x)*(nz/_zoom);
      _pan.y=(my-cy)-(my-cy-_pan.y)*(nz/_zoom);
      _zoom=nz;
    },{passive:false});

    // ── TOUCH: node-drag vs pan vs pinch-zoom ─────────
    let _lt=null;
    let _touchDragNode=null;
    cv.addEventListener('touchstart',e=>{
      e.preventDefault();
      _didDrag=false;
      if(e.touches.length===1){
        const r=cv.getBoundingClientRect();
        const tx=e.touches[0].clientX-r.left,ty=e.touches[0].clientY-r.top;
        const h=hit(tx,ty);
        if(h&&!h.isMe){
          _touchDragNode=h;_hoverNode=h;
        } else {
          _panDrag={sx:tx,sy:ty,px:_pan.x,py:_pan.y};
        }
      }
      if(e.touches.length===2){_lt=Array.from(e.touches);_touchDragNode=null;_panDrag=null;}
    },{passive:false});

    cv.addEventListener('touchmove',e=>{
      e.preventDefault();
      const r=cv.getBoundingClientRect();
      if(e.touches.length===1){
        const tx=e.touches[0].clientX-r.left,ty=e.touches[0].clientY-r.top;
        if(_touchDragNode){
          const w=screenToWorld(tx,ty);
          _touchDragNode.x=w.x;_touchDragNode.y=w.y;
          _didDrag=true;
        } else if(_panDrag){
          const dx=tx-_panDrag.sx,dy=ty-_panDrag.sy;
          if(Math.abs(dx)>3||Math.abs(dy)>3)_didDrag=true;
          _pan.x=_panDrag.px+dx;_pan.y=_panDrag.py+dy;
        }
      }
      if(e.touches.length===2&&_lt){
        const t=Array.from(e.touches);
        const pd=Math.hypot(_lt[0].clientX-_lt[1].clientX,_lt[0].clientY-_lt[1].clientY);
        const cd=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
        if(pd>0)_zoom=Math.min(4,Math.max(0.25,_zoom*cd/pd));
        _lt=t;
      }
    },{passive:false});

    cv.addEventListener('touchend',e=>{
      e.preventDefault();
      if(_didDrag&&_touchDragNode){
        saveNodePositions();
      } else if(!_didDrag&&e.changedTouches.length===1){
        const r=cv.getBoundingClientRect();
        const t=e.changedTouches[0];
        const h=hit(t.clientX-r.left,t.clientY-r.top);
        if(h&&!h.isMe){ocid=h.id;goTab('contacts');}
      }
      _touchDragNode=null;_panDrag=null;_lt=null;_didDrag=false;
    },{passive:false});
  },80);
}


// ══ PATH CANVAS ═════════════════════════════════════
function drawPathCanvas(){
  const wrap=document.getElementById('path-canvas-wrap');if(!wrap||!pathResult)return;
  const path=pathResult,W=wrap.clientWidth,H=wrap.clientHeight||230,dpr=window.devicePixelRatio||1;
  const cv=document.createElement('canvas');
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';cv.style.display='block';
  wrap.innerHTML='';wrap.appendChild(cv);
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const n=path.length,nodeR=26,pady=H/2;
  const gapX=Math.min((W-nodeR*2)/(Math.max(n,2)),120);
  const startX=(W-(n-1)*gapX)/2;
  const positions=path.map((_,i)=>({x:startX+i*gapX,y:pady}));
  for(let i=0;i<positions.length-1;i++){
    const a=positions[i],b=positions[i+1],es=edgeStrength(path[i].id,path[i+1].id),edgeNode=path[i+1].edge;
    const grad=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    grad.addColorStop(0,'#4f46e5');grad.addColorStop(1,'#06b6d4');
    ctx.beginPath();ctx.moveTo(a.x+nodeR,a.y);ctx.lineTo(b.x-nodeR,b.y);
    ctx.strokeStyle=grad;ctx.lineWidth=1.5+es*2.5;ctx.stroke();
    const mx=(a.x+b.x)/2,my=a.y-19;
    ctx.fillStyle='#818cf8';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(Math.round(es*100)+'%',mx,my);
    const angle=Math.atan2(b.y-a.y,b.x-a.x),ax=b.x-nodeR-7,ay=b.y;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax-9*Math.cos(angle-0.4),ay-9*Math.sin(angle-0.4));ctx.lineTo(ax-9*Math.cos(angle+0.4),ay-9*Math.sin(angle+0.4));ctx.closePath();ctx.fillStyle='#06b6d4';ctx.fill();
    if(edgeNode&&edgeNode.label&&edgeNode.type!=='me'){ctx.fillStyle='#47556990';ctx.font='9px sans-serif';ctx.fillText(edgeNode.label.slice(0,16),mx,my+13);}
  }
  path.forEach((p,i)=>{
    const isMeNode=p.id==='me';
    const c=isMeNode?{name:S.me&&S.me.name?S.me.name:'Я',level:5,trust:100}:S.contacts.find(x=>x.id===p.id);
    if(!c)return;
    const l=lv(c.level),pos=positions[i],isLast=i===path.length-1;
    const nodeColor=isMeNode?'#d97806':isLast?'#059669':l.c;
    ctx.beginPath();ctx.arc(pos.x,pos.y,nodeR+6,0,Math.PI*2);ctx.fillStyle=nodeColor+'40';ctx.fill();
    ctx.beginPath();ctx.arc(pos.x,pos.y,nodeR,0,Math.PI*2);ctx.fillStyle=nodeColor+'60';ctx.fill();
    ctx.strokeStyle=nodeColor;ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle='#f1f5f9';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ini(c.name),pos.x,pos.y);
    ctx.fillStyle='#e2e8f0';ctx.font='bold 11px sans-serif';ctx.textBaseline='top';ctx.fillText(fname(c.name),pos.x,pos.y+nodeR+5);
    ctx.fillStyle='#64748b';ctx.font='9px sans-serif';ctx.fillText(isMeNode?'ВЫ':l.l,pos.x,pos.y+nodeR+18);
    if(isLast&&!isMeNode){ctx.fillStyle='#059669';ctx.font='bold 9px sans-serif';ctx.fillText('ЦЕЛЬ',pos.x,pos.y+nodeR+29);}
    ctx.fillStyle='#1e293b';ctx.strokeStyle='#334155';ctx.lineWidth=1;
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(pos.x-14,pos.y-nodeR-20,28,16,4);else ctx.rect(pos.x-14,pos.y-nodeR-20,28,16);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#c7d2fe';ctx.font='9px sans-serif';ctx.textBaseline='middle';
    ctx.fillText(isMeNode?'★ВЫ':'💙'+c.trust+'%',pos.x,pos.y-nodeR-12);
  });
}

function tDash(){
  const today=tod();
  const now=new Date();
  const dayN=['вс','пн','вт','ср','чт','пт','сб'];
  const monN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const dateStr=now.getDate()+' '+monN[now.getMonth()]+', '+dayN[now.getDay()];

  // ── helpers ──────────────────────────────────────────
  function daysUntil(d){if(!d)return 9999;return Math.ceil((new Date(d)-now)/864e5);}
  function daysSince(d){if(!d)return 9999;return Math.floor((now-new Date(d))/864e5);}
  function urgColor(n){return n<0?'#ef4444':n===0?'#f97316':n<=1?'#eab308':'#3b82f6';}
  function urgLabel(n){return n<0?'просрочено '+Math.abs(n)+'д':n===0?'сегодня':n===1?'завтра':'через '+n+' дн';}

  // ── 1. СРОЧНЫЕ ШАГИ ──────────────────────────────────
  const urgent=S.contacts
    .filter(function(c){return c.nextAction&&c.nextDate;})
    .map(function(c){return{c:c,d:daysUntil(c.nextDate)};})
    .filter(function(x){return x.d<=3;})
    .sort(function(a,b){return a.d-b.d;});

  // ── 2. ЗЯБНУТ (не касались >60 дней, уровень ≥2) ────
  const cold=S.contacts
    .filter(function(c){return !c.isTarget&&c.level>=2&&daysSince(c.lastContact)>60;})
    .sort(function(a,b){return daysSince(b.lastContact)-daysSince(a.lastContact);})
    .slice(0,5);

  // ── 3. МАРКОВ-АЛЕРТЫ: predictStates на 6 мес ─────────
  const markovAlerts=S.contacts.filter(function(c){return !c.isTarget&&c.level>1;}).map(function(c){
    var p6=predictStates(c,6);
    var dropRisk=Math.round((p6[0]+(c.level>1?p6[c.level-1]:0))*100);
    var stayPct=Math.round(p6[c.level]*100);
    return{c:c,drop:dropRisk,stay:stayPct};
  }).filter(function(x){return x.drop>20;})
    .sort(function(a,b){return b.drop-a.drop;})
    .slice(0,4);

  // ── 4. ДНИ РОЖДЕНИЯ в ближайшие 14 дней ─────────────
  var bdays=[];
  S.contacts.forEach(function(c){
    if(!c.birthday)return;

  const targets=S.contacts.filter(function(c){return c.isTarget;});

  // ── 6. ПРОГРЕСС СТРАТЕГИЧЕСКИХ ЦЕЛЕЙ ─────────────────

    var linked=(g.contacts||[]).filter(function(id){return S.contacts.find(function(c){return c.id===id;});}).length;

      var c=S.contacts.find(function(x){return x.id===id;});

    var isEmpty=!linked;
    var pct=maxL?Math.round(maxL/5*100):0;
    return{g:g,linked:linked,maxL:maxL,isEmpty:isEmpty,pct:pct};

  const allies=realContacts.filter(function(c){return c.level===5;}).length;

      h+='<div style="height:3px;background:#1e293b;border-radius:2px;margin-top:3px"><div style="width:'+barW+'%;height:100%;background:'+dc+';border-radius:2px"></div></div>';

      h+='<div style="font-size:11px;font-weight:700;color:'+dc+';flex-shrink:0">↓'+x.drop+'%</div>';

  // ── ДНИ РОЖДЕНИЯ ─────────────────────────────────────
  if(bdays.length){
    h+='<div style="background:#0d1117;border:1px solid #d9770630;border-radius:10px;padding:11px 12px;margin-bottom:10px">';
    h+='<div style="font-size:10px;color:#fbbf24;font-weight:600;margin-bottom:6px;letter-spacing:.4px">🎂 ДНИ РОЖДЕНИЯ · БЛИЖАЙШИЕ 14 ДНЕЙ</div>';
    bdays.forEach(function(x){
      var l=lv(x.c.level);
      var dl=x.diff===0?'сегодня':x.diff===1?'завтра':'через '+x.diff+' дн';

      h+='<div class="av" style="width:27px;height:27px;font-size:10px;flex-shrink:0;background:'+l.c+'22;border-color:'+l.c+';color:'+l.c+'">'+ini(x.c.name)+'</div>';
      h+='<div style="flex:1;min-width:0;font-size:11px;font-weight:600">'+esc(x.c.name)+'</div>';
      h+='<div style="font-size:10px;font-weight:700;color:'+bc+';flex-shrink:0;background:'+bc+'18;border-radius:6px;padding:2px 8px">🎂 '+dl+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }

  // ── ЗЯБНУТ ───────────────────────────────────────────
  if(cold.length){
    h+='<div style="background:#0d1117;border:1px solid #1e293b;border-radius:10px;padding:11px 12px;margin-bottom:10px">';
    h+='<div style="font-size:10px;color:#7c3aed;font-weight:600;margin-bottom:6px;letter-spacing:.4px">🧊 ЗЯБНУТ · НЕТ КОНТАКТА >60 ДНЕЙ</div>';
    cold.forEach(function(c){
      var l=lv(c.level);
      var ds=daysSince(c.lastContact);
      h+='<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #0f1929;cursor:pointer" onclick="ocid='+c.id+';goTab(\'contacts\')">';
      h+='<div class="av" style="width:27px;height:27px;font-size:10px;flex-shrink:0;background:'+l.c+'22;border-color:'+l.c+';color:'+l.c+'">'+ini(c.name)+'</div>';
      h+='<div style="flex:1;min-width:0">';
      h+='<div style="font-size:11px;font-weight:600">'+esc(c.name)+'</div>';
      h+='<div style="font-size:10px;color:#64748b">'+esc(c.org||l.l)+'</div>';
      h+='</div>';

    h+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">';
    h+='<div style="font-size:10px;color:#ef4444;font-weight:600;letter-spacing:.4px;flex:1">🎯 ОПЕРАЦИИ В РАБОТЕ</div>';
    h+='<div style="font-size:10px;color:#475569">'+targets.length+' цел'+(targets.length===1?'ь':targets.length<5?'и':'ей')+'</div>';
    h+='</div>';
    targets.slice(0,3).forEach(function(c){
      var bridges=scoreBridges(c);
      var topB=bridges[0];
      h+='<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #0f1929">';
      h+='<div style="width:28px;height:28px;border-radius:50%;background:#1a0000;border:1.5px dashed #ef4444;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">🎯</div>';
      h+='<div style="flex:1;min-width:0;cursor:pointer" onclick="ocid='+c.id+';goTab(\'contacts\')">';
      h+='<div style="font-size:11px;font-weight:600">'+esc(c.name)+'</div>';
      h+=topB
        ?'<div style="font-size:10px;color:#64748b">Мост: <b style="color:#fca5a5">'+esc(topB.name)+'</b> ('+topB.score+'%)</div>'
        :'<div style="font-size:10px;color:#334155">Нет мостов — заполните профиль</div>';
      h+='</div>';
      h+='<button class="btn sm" style="background:#ef444418;border-color:#ef444440;color:#fca5a5;font-size:10px;flex-shrink:0;padding:3px 8px" onclick="openTargetM('+c.id+')">OSINT</button>';
      h+='</div>';
    });
    h+='</div>';
  }

  // ── ПРОГРЕСС СТРАТЕГИЧЕСКИХ ЦЕЛЕЙ ─────────────────────
  if(goalStats.length){
    h+='<div style="background:#0d1117;border:1px solid #1e293b;border-radius:10px;padding:11px 12px;margin-bottom:10px">';
    h+='<div style="font-size:10px;color:#818cf8;font-weight:600;margin-bottom:8px;letter-spacing:.4px">🎯 ПРОГРЕСС ПО СТРАТЕГИЧЕСКИМ ЦЕЛЯМ</div>';
    goalStats.forEach(function(gs){
      var g=gs.g;
      var lc=gs.pct>=80?'#059669':gs.pct>=50?'#d97706':gs.isEmpty?'#334155':'#64748b';
      h+='<div style="margin-bottom:9px;cursor:pointer" onclick="goTab(\'goals\')">';
      h+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">';
      h+='<div style="font-size:11px;font-weight:600;color:'+(gs.isEmpty?'#475569':'#e2e8f0')+'">'+esc(g.title||'Цель')+(gs.isEmpty?' <span style="color:#475569;font-weight:400">(нет контактов)</span>':'')+'</div>';
      h+='<div style="font-size:10px;color:'+lc+'">'+(gs.isEmpty?'—':gs.linked+' конт. · ур.'+gs.maxL)+'</div>';
      h+='</div>';
      h+='<div style="height:5px;background:#1e293b;border-radius:3px">';
      if(!gs.isEmpty)h+='<div style="width:'+gs.pct+'%;height:100%;background:'+lc+';border-radius:3px"></div>';
      h+='</div>';
      h+='</div>';
    });
    if(emptyGoals.length){
      h+='<div style="font-size:10px;color:#475569;margin-top:4px">⚠️ '+emptyGoals.length+' цел'+(emptyGoals.length===1?'ь':emptyGoals.length<5?'и':'ей')+' без единого контакта</div>';
    }
    h+='</div>';
  }

  // ── ЦИТАТА ────────────────────────────────────────────
  var qi=(now.getDate()*7+now.getMonth()*3)%QUOTES.length;
  var q=QUOTES[qi];
  h+='<div style="background:#080d1a;border:1px solid #1e293b;border-radius:10px;padding:11px 14px">';
  h+='<div style="font-size:11px;color:#94a3b8;line-height:1.6;font-style:italic">&laquo;'+esc(q.t)+'&raquo;</div>';
  h+='<div style="font-size:10px;color:#334155;margin-top:4px;text-align:right">— '+esc(q.a)+'</div>';
  h+='</div>';

  return h;
}

function openConnM(){
  if(!S.contacts.length){notify('❌ Добавьте контакты');return;}
  const o=S.contacts.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  openM(`<h3>➕ Связь между контактами</h3>
    <div class="fld"><label class="lbl">От кого</label><select id="cn-a">${o}</select></div>
    <div class="fld"><label class="lbl">До кого</label><select id="cn-b">${o}</select></div>
    <div class="fld"><label class="lbl">Описание</label><input id="cn-l" placeholder="деловые партнёры"></div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn bp" onclick="saveConn()">Добавить</button>
      <button class="btn bg" onclick="closeM()">Отмена</button>
    </div>`);
}
function saveConn(){
  const a=+gv('cn-a'),b=+gv('cn-b');
  if(a===b){notify('❌ Выберите разные');return;}
  S.conns=[...(S.conns||[]),{id:uid(),from:a,to:b,label:gv('cn-l')}];
  save();closeM();notify('🔗 Связь добавлена');render();
}

}

function tPath(){
  if(!S.contacts.length)return`<div class="card" style="color:#64748b;text-align:center;padding:30px">Добавьте контакты</div>`;
  const meOpt=`<option value="me"${pathFrom==='me'?' selected':''}>🕵️ ${esc(S.me&&S.me.name?S.me.name:'Я (Вы)')}</option>`;
  const co=meOpt+S.contacts.map(c=>`<option value="${c.id}"${String(pathFrom)===String(c.id)?' selected':''}>${esc(c.name)}</option>`).join('');
  const ct=S.contacts.map(c=>`<option value="${c.id}"${String(pathTo)===String(c.id)?' selected':''}>${esc(c.name)}</option>`).join('');

  let resultHtml='';
  if(pathResult&&pathResult.length){
    const sc=Math.round(pathScore(pathResult)*100);
    const scColor=sc>=60?'#059669':sc>=35?'#d97706':'#dc2626';
    const targetNode=pathResult[pathResult.length-1];
    const target=targetNode.id==='me'?null:S.contacts.find(c=>c.id===targetNode.id);
    const hints=target?pathHints(pathResult,targetNode.id):[];
    const hintHtml=hints.map(h=>`<div class="hint-box" style="background:${h.bg};border:1px solid ${h.color}44">
      <span style="font-size:18px;flex-shrink:0">${h.icon}</span>
      <span style="font-size:12px;color:#94a3b8;line-height:1.6">${h.text}</span>
    </div>`).join('');

    const altHtml=_allPaths.length>1?`<div style="margin-top:14px">
      <div style="font-size:12px;color:#64748b;font-weight:600;margin-bottom:8px">Альтернативные маршруты — нажмите для выбора:</div>
      ${_allPaths.map((p,i)=>{
        const sc2=Math.round(pathScore(p)*100);
        const nodes=p.map(n=>{if(n.id==='me')return S.me&&S.me.name?meName():'Я';const cc=S.contacts.find(x=>x.id===n.id);return cc?fname(cc.name):'?';}).join(' → ');
        const sc2Color=sc2>=60?'#059669':sc2>=35?'#d97706':'#dc2626';
        const isSel=JSON.stringify(pathResult)===JSON.stringify(p);
        return`<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:${isSel?'#1e1b4b':'#0f172a'};border-radius:8px;margin-bottom:5px;cursor:pointer;border:1px solid ${isSel?'#4f46e5':'#334155'}" onclick="selectAltPath(${i})">
          <span style="font-size:11px;color:#94a3b8;flex:1;pointer-events:none">${nodes}</span>
          <span style="font-size:13px;color:${sc2Color};font-weight:700;flex-shrink:0;pointer-events:none">${sc2}%</span>
          <span style="font-size:10px;color:#64748b;pointer-events:none">${p.length-1} шаг${p.length-1===1?'':'а'}</span>
        </div>`;
      }).join('')}
    </div>`:'';

    _highlight.nodes=new Set(pathResult.map(p=>p.id));
    _highlight.edges=[];
    for(let i=0;i<pathResult.length-1;i++)_highlight.edges.push({from:pathResult[i].id,to:pathResult[i+1].id});

    resultHtml=`<div class="card" style="margin-bottom:12px;border-color:#4f46e544">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <div style="width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,${scColor},#06b6d4);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0">${sc}%</div>
        <div>
          <div style="font-weight:700;font-size:15px;color:#c7d2fe">Вероятность успеха цепочки</div>
          <div style="font-size:11px;color:#64748b">${pathResult.length-1} шаг${pathResult.length-1===1?'':'а'} · P=Π(σᵢ)/√L · σ(ME)=trust×0.65+level×0.35</div>
        </div>
      </div>
      <div id="path-canvas-wrap" style="height:230px"></div>
    </div>
    ${hintHtml?`<div style="font-size:12px;color:#818cf8;font-weight:600;margin-bottom:8px">💡 Подсказки разведчика</div>${hintHtml}`:''}
    ${altHtml}`;
    setTimeout(drawPathCanvas,60);
  } else {
    _highlight={nodes:new Set(),edges:[]};
  }

  return`<div class="card" style="margin-bottom:14px">
    <div style="font-size:12px;color:#818cf8;font-weight:600;margin-bottom:10px">🔍 Найти оптимальный путь к цели</div>
    <div style="font-size:11px;color:#64748b;margin-bottom:10px;line-height:1.55;background:#0f172a;border-radius:7px;padding:9px">
      <b style="color:#a78bfa">P = Π(σᵢ)/√L</b> — произведение сил связей, делённое на корень длины. σ(ME) = trust×0.65 + level×0.35.
    </div>
    <div class="g2">
      <div class="fld"><label class="lbl">Откуда</label><select id="pf" onchange="pathFrom=this.value">${co}</select></div>
      <div class="fld"><label class="lbl">Целевой контакт</label><select id="pt" onchange="pathTo=this.value">${ct}</select></div>
    </div>
    <button class="btn bp" style="width:100%;margin-top:4px" onclick="runPathSearch()">Найти оптимальный путь →</button>
  </div>
  ${resultHtml}`;
}

function runPathSearch(){
  pathFrom=gv('pf')||pathFrom;pathTo=gv('pt');
  if(!pathTo){notify('❌ Выберите целевой контакт');return;}
  const fromId=pathFrom==='me'?'me':+pathFrom;
  const toId=+pathTo;
  if(String(fromId)===String(toId)){notify('❌ Выберите разные');return;}
  _allPaths=findPaths(fromId,toId,4);
  if(!_allPaths.length){pathResult=null;notify('❌ Путей не найдено. Добавьте связи или общие цели.');render();return;}
  _allPaths.sort((a,b)=>pathScore(b)-pathScore(a));
  pathResult=_allPaths[0];
  render();
}

function selectAltPath(i){
  if(_allPaths[i]){pathResult=_allPaths[i];render();setTimeout(drawPathCanvas,60);}
}

function tPotential(){
  if(!S.contacts.length)return`<div class="card" style="color:#64748b;text-align:center;padding:30px">Нет контактов</div>`;
  const sorted=[...S.contacts].sort((a,b)=>{const ua=calcUpgrade(a),ub=calcUpgrade(b);return(ub.up||0)-(ua.up||0);});
  return`<div style="font-size:12px;color:#64748b;margin-bottom:12px;line-height:1.55;background:#0d1117;border-radius:8px;padding:10px;border:1px solid #1e293b">
    <b style="color:#a78bfa">P = σ(8·(z−0.5))</b>, где z = 0.4·доверие + 0.3·рецентность + 0.2·цели + 0.1·действие
  </div>
  ${sorted.map(c=>{
    const u=calcUpgrade(c),l=lv(c.level),nextL=lv(Math.min(c.level+1,5));
    const upColor=u.up>=65?'#059669':u.up>=40?'#d97706':'#dc2626';
    const drColor=u.down>=50?'#dc2626':u.down>=30?'#d97706':'#64748b';
    // Four factors as miniChart-style bars
    const fData=[
      {label:'Доверие', val:u.trustRatio||0, hint:c.trust+'%', color:'#4f46e5'},
      {label:'Рецентность', val:u.recency||0, hint:u.days<999?u.days+'д':'—', color:'#06b6d4'},
      {label:'Цели', val:u.goalF||0, hint:S.goals.filter(g=>(g.contacts||[]).includes(c.id)).length+'цел.', color:'#7c3aed'},
      {label:'Шаг', val:(u.actionF||0)*100, hint:u.actionF?'✓':'✗', color:'#059669'},
    ];
    const maxFval=Math.max(...fData.map(f=>f.val),1);
    const chartH=54;
    const factorBars=fData.map(f=>{
      const pct=Math.round(f.val);
      const h=Math.max(pct>0?5:2,Math.round(f.val/100*chartH));
      const col=pct>=70?'#059669':pct>=40?f.color:pct>=15?'#d97706':'#64748b';
      return`<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;gap:0">
        <div style="font-size:9px;color:${col};font-weight:700;min-height:13px;line-height:13px;text-align:center">${pct>0?pct+'%':''}</div>
        <div style="width:72%;height:${h}px;background:${col};border-radius:2px 2px 0 0;min-height:${pct>0?5:2}px;opacity:${pct>0?1:0.18}"></div>
        <div style="width:100%;height:1px;background:#1e293b;margin-bottom:3px"></div>
        <div style="font-size:8px;color:#475569;text-align:center;line-height:1.2">${f.label}</div>
        <div style="font-size:8px;color:#334155;text-align:center">${f.hint}</div>
      </div>`;
    }).join('');
    return`<div class="card" style="margin-bottom:10px;border-color:${l.c}33;padding:12px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div class="av" style="width:38px;height:38px;font-size:13px;background:${l.c}22;border-color:${l.c};color:${l.c}">${ini(c.name)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:13px">${esc(c.name)}</div>
          <div style="font-size:11px;color:#64748b">${l.l}${c.level<5?' → '+nextL.l:' (максимум)'}</div>
        </div>
        ${u.up!==null?`<div style="text-align:right;flex-shrink:0"><div style="font-size:10px;color:#64748b">апгрейд</div><div style="font-size:22px;font-weight:700;color:${upColor};line-height:1">${u.up}%</div></div>`:`<span class="badge" style="background:#05966922;color:#059669">★ Союзник</span>`}
      </div>
      ${u.up!==null?`<div class="bar" style="height:5px;margin-bottom:10px"><div class="barf ${u.up>=65?'bfg':u.up>=40?'bfy':'bfr'}" style="width:${u.up}%"></div></div>`:''}
      <div style="background:#0d1117;border-radius:8px;padding:9px 8px 6px;border:1px solid #1e293b">
        <div style="font-size:9px;color:#475569;font-weight:600;margin-bottom:7px;letter-spacing:.5px">ФАКТОРЫ АПГРЕЙДА</div>
        <div style="display:flex;align-items:flex-end;gap:4px;height:${chartH+28}px">${factorBars}</div>
      </div>
      <div style="margin-top:9px;background:#0d1117;border-radius:8px;padding:9px 10px;border:1px solid #1e293b">
        <div style="font-size:9px;color:#475569;font-weight:600;letter-spacing:.5px;margin-bottom:6px">💡 ЧТО ДЕЛАТЬ</div>
        ${(()=>{
          const tips=[];
          if((u.trustRatio||0)<50)tips.push({icon:'🤝',txt:'Проведите личную встречу — доверие ниже 50%'});
          if((u.recency||0)<30)tips.push({icon:'📅',txt:u.days>30?'Не было контакта '+u.days+' дн. — свяжитесь сегодня':'Запланируйте регулярный касаний'});
          if((u.goalF||0)<40)tips.push({icon:'🎯',txt:'Добавьте в общую стратегическую цель — усилит связь'});
          if(!(u.actionF))tips.push({icon:'⚡',txt:'Задайте конкретный следующий шаг и дату'});
          if(c.level<5&&(u.up||0)<40)tips.push({icon:'🔮',txt:'Слабый потенциал апгрейда — нужны системные инвестиции'});
          if(u.down>=40)tips.push({icon:'⚠️',txt:'Высокий риск деградации — приоритизируйте этот контакт'});
          if(!tips.length)tips.push({icon:'✅',txt:'Отличная динамика! Поддерживайте текущий ритм'});
          return tips.slice(0,3).map(t=>`<div style="display:flex;align-items:flex-start;gap:7px;margin-bottom:5px;font-size:11px;color:#94a3b8;line-height:1.4"><span style="flex-shrink:0">${t.icon}</span><span>${t.txt}</span></div>`).join('');
        })()}
      </div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
        <div style="flex:1;font-size:11px;color:#64748b">Риск снижения: <span style="color:${drColor};font-weight:600">${u.down}%</span></div>
        <button class="btn sm bp" onclick="AS.cid='${c.id}';ATAB='markov';render()">🔮 Марков</button>
      </div>
    </div>`;
  }).join('')}`;
}

function tConnectors(){
  if(!S.contacts.length)return`<div class="card" style="color:#64748b;text-align:center;padding:30px">Нет контактов</div>`;
  const cScores=calcCentrality();
  const sci=S.contacts.reduce((m,c)=>({...m,[c.id]:socialCapital(c,cScores)}),{});
  const sorted=[...S.contacts].sort((a,b)=>sci[b.id]-sci[a.id]);
  const maxSCI=Math.max(...Object.values(sci),1);
  return`<div style="font-size:12px;color:#64748b;margin-bottom:12px;line-height:1.55;background:#0f172a;border-radius:8px;padding:10px">
    <b style="color:#a78bfa">SCI = 0.35·доверие + 0.30·уровень + 0.20·степень + 0.15·посредничество</b>
  </div>
  ${sorted.map((c,i)=>{
    const l=lv(c.level),bc=cScores[c.id]||0,sc=sci[c.id];

    const role=bc>=3?'🌉 Мост':bc>=1?'🔗 Коннектор':deg>=3?'🌟 Узловой':'👤 Рядовой';
    return`<div class="card" style="display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;border-color:${l.c}33">
      <div style="font-size:22px;font-weight:700;color:#334155;flex-shrink:0;min-width:26px;text-align:center">${i+1}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <div class="av" style="width:34px;height:34px;font-size:12px;background:${l.c}22;border-color:${l.c};color:${l.c}">${ini(c.name)}</div>
          <div><div style="font-weight:600;font-size:13px">${esc(c.name)}</div><div style="font-size:11px;color:#64748b">${role}</div></div>
          <div style="margin-left:auto;text-align:right"><div style="font-size:18px;font-weight:700;color:#c7d2fe">${sc}</div><div style="font-size:9px;color:#64748b">SCI</div></div>
        </div>
        <div class="bar" style="height:6px;margin-bottom:7px"><div class="barf bfp" style="width:${Math.round(sc/maxSCI*100)}%"></div></div>
        <div style="display:flex;gap:12px;font-size:11px;color:#64748b">
          <span>Связей: <b style="color:#94a3b8">${deg}</b></span>
          <span>Посредник: <b style="color:#94a3b8">${bc}</b></span>
          <span>Доверие: <b style="color:#94a3b8">${c.trust}%</b></span>
        </div>
        ${bc>=2?`<div style="margin-top:8px;font-size:11px;color:#a78bfa;background:#1e1b4b;border-radius:6px;padding:7px">💡 Ключевой коннектор — через ${fname(c.name)} проходит ${bc} кратчайших путей. Приоритизируйте инвестиции.</div>`:''}
      </div>
    </div>`;
  }).join('')}`;
}

// Shared bar chart: identical style used in Markov AND Potential AND Contacts
function miniStateChart(v,label,contact){
  // v = array [p0,p1,p2,p3,p4,p5]  where 0=lost, 1-5=levels
  const SC=['#dc2626','#64748b','#2563eb','#7c3aed','#d97706','#059669'];
  const SL=['Потеря','Знаком.','Контакт','Полезн.','Довер.','Союзник'];
  const maxP=Math.max(...[0,1,2,3,4,5].map(s=>v[s]||0),0.01);
  const chartH=58;
  const cols=[0,1,2,3,4,5].map(s=>{
    const pct=Math.round((v[s]||0)*100);
    const h=Math.max(pct>0?4:1,Math.round((v[s]||0)/maxP*chartH));
    const col=SC[s];
    const isCur=contact&&s===contact.level;
    return`<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0">
      <div style="font-size:8.5px;color:${col};font-weight:700;min-height:13px;line-height:13px;text-align:center">${pct>0?pct+'%':''}</div>
      <div style="width:74%;height:${h}px;background:${col};border-radius:2px 2px 0 0;min-height:${pct>0?4:1}px;opacity:${pct>0?1:0.15}${isCur?';box-shadow:0 0 0 1.5px '+col+',0 0 6px '+col+'60':''}"></div>
      <div style="width:100%;height:1px;background:#1e293b;margin-bottom:2px"></div>
      <div style="font-size:7.5px;color:#475569;text-align:center;line-height:1.2">${SL[s]}</div>
    </div>`;
  }).join('');
  return`<div style="background:#0d1117;border-radius:8px;padding:9px 6px 8px;border:1px solid #1e293b;flex:1;min-width:0">
    <div style="font-size:10px;color:#818cf8;font-weight:600;margin-bottom:7px">${label}</div>
    <div style="display:flex;align-items:flex-end;gap:3px;height:${chartH+15}px">${cols}</div>
  </div>`;
}

function tMarkov(){
  const mCid=AS.cid||(S.contacts[0]?String(S.contacts[0].id):'');
  const mc=S.contacts.find(c=>String(c.id)===String(mCid));
  const cO=S.contacts.map(c=>`<option value="${c.id}"${String(mCid)===String(c.id)?' selected':''}>${esc(c.name)}</option>`).join('');

  let contactSection='';
  if(mc){
    const p3=predictStates(mc,3),p6=predictStates(mc,6),p12=predictStates(mc,12),p24=predictStates(mc,24);
    const ss=steadyState(mc),trans=getMonthlyTrans(mc);
    const mtl4=mc.level<4?monthsToLevel(mc,4):null;
    const mtl5=mc.level<5?monthsToLevel(mc,5):null;
    const p12l5=Math.round(p12[5]*100);
    const p24l5=Math.round(p24[5]*100);
    const el12=expLevel(p12),el24=expLevel(p24);

    let insightIcon='📊',insightTxt='';
    if(mc.level>=4&&trans.pUp>=0.08){
      insightIcon='🚀';insightTxt=`Высокий темп: есть ${p12l5}% шанс достичь «Союзника» за ~${mtl5||'12+'} мес. За 12 мес. вероятность уровня 5: ${p12l5}%. Инвестируйте активно сейчас.`;
    } else if(mc.level===5){
      insightIcon='★';insightTxt=`Союзник. Вероятность удержания через 12 мес: ${Math.round(p12[5]*100)}%, через 24 мес: ${p24l5}%. Поддерживайте регулярный контакт.`;
    } else if(trans.pDown>trans.pUp*1.5){
      insightIcon='⚠️';insightTxt=`Риск деградации: даунгрейд вероятнее апгрейда (${Math.round(trans.pDown*100)}% vs ${Math.round(trans.pUp*100)}%/мес). Запланируйте контакт в ближайшие 2 недели.`;
    } else if(mc.level<3&&trans.pLost>0.015){
      insightIcon='💡';insightTxt=`Контакт редкий, риск потери ${Math.round(trans.pLost*100)}%/мес. Назначьте встречу для повышения доверия.`;
    } else {
      insightTxt=`Стабильная динамика. Ожидаемый уровень: 12 мес. → ${el12}${mtl5?' · до Союзника ~'+mtl5+' мес.':''}, 24 мес. → ${el24}.`;
    }

    contactSection=`
    <div style="background:#0d1117;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #1e293b">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <div class="av" style="width:44px;height:44px;font-size:15px;background:${lv(mc.level).c}22;border-color:${lv(mc.level).c};color:${lv(mc.level).c}">${ini(mc.name)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">${esc(mc.name)}</div>
          <div style="font-size:11px;color:#64748b">${lv(mc.level).l} · уровень ${mc.level}</div>
        </div>
        ${mc.level<5?`<div style="text-align:right;flex-shrink:0">
          <div style="font-size:10px;color:#64748b;margin-bottom:2px">до Союзника</div>
          <div style="font-size:20px;font-weight:700;color:#059669;line-height:1">${mtl5?mtl5+'м':'—'}</div>
          <div style="font-size:10px;color:#059669;margin-top:1px">P=${p12l5}%</div>
        </div>`:`<span class="badge" style="background:#05966922;color:#059669;font-size:13px;padding:6px 12px">★ Союзник</span>`}
      </div>

      <div style="font-size:10px;color:#64748b;font-weight:600;margin-bottom:7px;letter-spacing:.5px">ЕЖЕМЕСЯЧНЫЕ ВЕРОЯТНОСТИ ПЕРЕХОДА</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
        <div style="background:#05966914;border:1px solid #05966944;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;color:#34d399">↑ Апгрейд: ${Math.round(trans.pUp*100)}%</div>
        <div style="background:#dc262614;border:1px solid #dc262644;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;color:#f87171">↓ Даунгрейд: ${Math.round(trans.pDown*100)}%</div>
        <div style="background:#ef444414;border:1px solid #ef444440;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;color:#fca5a5">☠ Потеря: ${Math.round(trans.pLost*100)}%</div>
        <div style="background:#33415530;border:1px solid #47556860;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;color:#94a3b8">→ Без изм: ${Math.round(trans.pStay*100)}%</div>
      </div>

      <div style="font-size:10px;color:#64748b;font-weight:600;margin-bottom:8px;letter-spacing:.5px">ПРОГНОЗ РАСПРЕДЕЛЕНИЯ СОСТОЯНИЙ (P<sup>n</sup>·v<sub>0</sub>)</div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        ${miniStateChart(p3,'3 мес.',mc)}
        ${miniStateChart(p6,'6 мес.',mc)}
      </div>
      <div style="display:flex;gap:6px;margin-bottom:12px">
        ${miniStateChart(p12,'12 мес.',mc)}
        ${miniStateChart(p24,'24 мес.',mc)}
      </div>

      <div style="background:#1e1b4b;border-radius:8px;padding:9px 12px;font-size:11px;color:#a5b4fc;line-height:1.6">${insightIcon} ${insightTxt}</div>
    </div>

    <div style="background:#0d1117;border-radius:10px;padding:12px;border:1px solid #1e293b;margin-bottom:12px">
      <div style="font-size:10px;color:#64748b;font-weight:600;margin-bottom:9px;letter-spacing:.5px">♾️ РАВНОВЕСИЕ (24 МЕС.)</div>
      ${[1,2,3,4,5].map(s=>{const l2=lv(s);return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
        <span style="width:82px;font-size:10px;color:${l2.c};flex-shrink:0">${l2.l}</span>
        <div style="flex:1;height:8px;background:#1e293b;border-radius:4px;overflow:hidden"><div style="width:${Math.round(ss[s]*100)}%;height:100%;background:${l2.c}88;border-radius:4px"></div></div>
        <span style="width:30px;font-size:10px;color:#64748b;text-align:right;flex-shrink:0">${Math.round(ss[s]*100)}%</span>
      </div>`;}).join('')}
      <div style="font-size:10px;color:#475569;margin-top:7px">Равновесный уровень: <b style="color:#c7d2fe">${expLevel(ss)}</b></div>
    </div>`;
  }

  const netForecast=S.contacts.map(c=>{
    const p12=predictStates(c,12);
    const el=parseFloat(expLevel(p12));
    return{c,el,delta:el-c.level,pLost:Math.round(p12[0]*100)};
  }).sort((a,b)=>b.delta-a.delta);

  return`<div style="font-size:11px;color:#64748b;margin-bottom:14px;line-height:1.55;background:#0d1117;border-radius:8px;padding:10px;border:1px solid #1e293b">
    <b style="color:#a78bfa">Цепи Маркова</b>: 6 состояний (0=потерян, 1–5=уровни). Матрица T[s→s'] строится из рецентности, доверия и целей. N итераций = прогноз на N месяцев.
  </div>
  <div class="fld" style="margin-bottom:14px">
    <label class="lbl">Контакт для детального анализа</label>
    <select onchange="AS.cid=this.value;render()">${cO}</select>
  </div>
  ${contactSection}
  <hr class="divider">
  <div style="font-size:11px;color:#818cf8;font-weight:600;margin-bottom:10px;letter-spacing:.5px">🌐 ПРОГНОЗ СЕТИ НА 12 МЕСЯЦЕВ</div>
  <div style="font-size:11px;color:#64748b;margin-bottom:10px">Ожидаемое изменение уровня при текущей динамике</div>
  ${netForecast.slice(0,10).map(f=>{
    const dColor=f.delta>0.15?'#059669':f.delta<-0.2?'#dc2626':'#64748b';
    const l=lv(f.c.level);
    return`<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0d1117;border-radius:8px;margin-bottom:6px;cursor:pointer;border:1px solid #1e293b" onclick="AS.cid='${f.c.id}';render()">
      <div class="av" style="width:32px;height:32px;font-size:11px;background:${l.c}22;border-color:${l.c};color:${l.c}">${ini(f.c.name)}</div>
      <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.c.name)}</div><div style="font-size:10px;color:#64748b">${l.l} → ожид. ${f.el.toFixed(1)}</div></div>
      <div style="font-size:14px;font-weight:700;color:${dColor};flex-shrink:0">${f.delta>0?'+':''}${f.delta.toFixed(2)}</div>
      ${f.pLost>15?`<div style="font-size:10px;color:#f87171;background:#dc262218;border-radius:6px;padding:2px 7px;flex-shrink:0">${f.pLost}%☠</div>`:''}
    </div>`;
  }).join('')}`;
}

function openCM(id){

  const cfI=(S.cFields||[]).map(f=>{
    const v=esc(cu[f.id]||'');
    if(f.type==='select'){const ops=(f.opts||'').split(',').filter(Boolean).map(o=>o.trim()).map(o=>`<option value="${esc(o)}"${cu[f.id]===o?' selected':''}>${esc(o)}</option>`).join('');return`<div class="fld"><label class="lbl">${esc(f.name)}</label><select id="cf_${f.id}">${ops}</select></div>`;}

    const flds=(s.fields||[]).map(f=>{const k=s.id+'_'+f.id,v=esc(cu[k]||'');if(f.type==='select'){const ops=(f.opts||'').split(',').filter(Boolean).map(o=>o.trim()).map(o=>`<option value="${esc(o)}"${cu[k]===o?' selected':''}>${esc(o)}</option>`).join('');return`<div class="fld"><label class="lbl">${esc(f.name)}</label><select id="cs_${k}">${ops}</select></div>`;}const t=f.type==='number'?'number':f.type==='date'?'date':'text';return`<div class="fld"><label class="lbl">${esc(f.name)}</label><input type="${t}" id="cs_${k}" value="${v}"></div>`;}).join('');
    return`<div style="border:1px solid #334155;border-radius:8px;padding:12px;margin-bottom:10px"><div style="font-size:12px;color:#818cf8;font-weight:600;margin-bottom:8px">📌 ${esc(s.name)}</div><div class="g2">${flds}</div></div>`;
  }).join('');
  openM(`<h3>${id?'✏️ Редактировать':'➕ Новый контакт'}</h3>
    <div class="g2">
      <div class="fld"><label class="lbl">Имя *</label><input id="c-n" value="${esc(c.name)}" placeholder="Имя Фамилия"></div>
      <div class="fld"><label class="lbl">Должность</label><input id="c-r" value="${esc(c.role||'')}"></div>
      <div class="fld"><label class="lbl">Организация</label><input id="c-o" value="${esc(c.org||'')}"></div>

      <div class="fld"><label class="lbl">Доверие %</label><input type="number" id="c-t" value="${c.trust}" min="0" max="100"></div>
      <div class="fld"><label class="lbl">Телефон</label><input type="tel" id="c-ph" value="${esc(c.phone||'')}"></div>
      <div class="fld"><label class="lbl">Email</label><input type="email" id="c-em" value="${esc(c.email||'')}"></div>
      <div class="fld"><label class="lbl">Telegram</label><input id="c-tg" value="${esc(c.telegram||'')}"></div>
      <div class="fld"><label class="lbl">🎂 День рождения</label><input type="date" id="c-bd" value="${c.birthday||''}"></div>
      <div class="fld"><label class="lbl">Последний контакт</label><input type="date" id="c-lc" value="${c.lastContact||''}"></div>

    <div class="fld"><label class="lbl">⚡ Следующий шаг</label><input id="c-na" value="${esc(c.nextAction||'')}" placeholder="Конкретное действие..."></div>

    ${cfI}${csI}
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:#94a3b8;padding:10px 0 6px;border-top:1px solid #1e293b;margin-top:4px">
      <input type="checkbox" id="c-tgt" ${c.isTarget?'checked':''} style="width:16px;height:16px;accent-color:#ef4444;cursor:pointer">

      <button class="btn bp" onclick="saveC(${id==null?'null':id})">${id?'Сохранить':'Добавить в сеть'}</button>
      <button class="btn bg" onclick="closeM()">Отмена</button>
    </div>`);
}
function saveC(id){
  const name=gv('c-n').trim();if(!name){notify('❌ Введите имя');return;}
  const cu={};
  (S.cFields||[]).forEach(f=>{const e=document.getElementById('cf_'+f.id);if(e)cu[f.id]=e.value;});
  (S.cSecs||[]).forEach(s=>(s.fields||[]).forEach(f=>{const k=s.id+'_'+f.id;const e=document.getElementById('cs_'+k);if(e)cu[k]=e.value;}));
  const d={name,role:gv('c-r'),org:gv('c-o'),circle:gv('c-ci'),level:+gv('c-lv'),trust:+gv('c-t'),phone:gv('c-ph'),email:gv('c-em'),telegram:gv('c-tg'),lastContact:gv('c-lc'),nextDate:gv('c-nd'),nextAction:gv('c-na'),notes:gv('c-nt'),custom:cu,isTarget:!!(document.getElementById('c-tgt')&&document.getElementById('c-tgt').checked),birthday:gv('c-bd')};
  if(id===null)S.contacts.push({...d,id:uid()});
  else S.contacts=S.contacts.map(c=>c.id===id?{...c,...d}:c);
  save();closeM();notify(id?'✅ Сохранено':'✅ Контакт добавлен');render();
}
function delC(id){
  if(!confirm('Удалить контакт?'))return;
  S.contacts=S.contacts.filter(c=>c.id!==id);
  S.goals=S.goals.map(g=>({...g,contacts:(g.contacts||[]).filter(x=>x!==id)}));
  S.conns=(S.conns||[]).filter(cn=>cn.from!==id&&cn.to!==id);
  ocid=null;save();notify('🗑️ Удалён');render();
}

    ${g.notes?`<div style="background:#0f172a;border-radius:8px;padding:10px"><div class="lbl">📋 Заметки</div><div style="font-size:12px;color:#94a3b8;line-height:1.55">${esc(g.notes)}</div></div>`:''}

function openGM(id){

function saveG(id){
  const t=gv('g-t').trim();if(!t){notify('❌ Введите название');return;}
  const cs=[...document.querySelectorAll('.gchk:checked')].map(x=>+x.value);
  const d={title:t,desc:gv('g-d'),progress:+gv('g-p'),deadline:gv('g-dl'),nextStep:gv('g-ns'),notes:gv('g-n'),contacts:cs};

  </div>`:'';
  return`${Q(6)}<div style="font-size:14px;color:#94a3b8;font-weight:500;margin-bottom:12px">🔍 Оценка контакта — метод разведчика</div>

function doAssess(){
  AS.txt=gv('as-txt')||AS.txt;
  const sc=Math.round((AS.q1+AS.q2+AS.q3+AS.q4+AS.q5)/5*20);
  let verdict,advice,tactic;
  if(sc>=80){verdict='🟢 Высокий потенциал';advice='Инвестируйте время активно — это ваш будущий союзник. Найдите точку взаимной ценности и закрепите совместным делом. Не форсируйте.';tactic='Взаимная польза + контакт каждые 2-3 недели';}
  else if(sc>=60){verdict='🔵 Перспективный';advice='Развивайте тактически. Найдите общий интерес. Давайте больше, чем берёте на старте.';tactic='Активное слушание + поиск общего интереса';}
  else if(sc>=40){verdict='🟡 Нейтральный';advice='Поддерживайте пассивно: поздравления, короткие сообщения раз в 2–3 месяца.';tactic='Пассивное поддержание без активных инвестиций';}
  else{verdict='🔴 Низкий приоритет';advice='Минимальные инвестиции. Не сжигайте мостов, но направьте ресурсы туда, где выше отдача.';tactic='Наблюдение издалека';}
  AS.res={sc,verdict,advice,tactic};render();
}
function saveAssess(){
  if(!AS.res||!AS.cid)return;
  const note=`\n\n[Оценка ${new Date().toLocaleDateString('ru')}] Индекс: ${AS.res.sc}/100 — ${AS.res.verdict}\nТактика: ${AS.res.tactic}${AS.txt?'\nВпечатления: '+AS.txt:''}`;
  S.contacts=S.contacts.map(c=>+c.id===+AS.cid?{...c,notes:(c.notes||'')+note}:c);
  save();notify('💾 Оценка сохранена');const cid=+AS.cid;AS.res=null;ocid=cid;goTab('contacts');
}

        <div style="display:flex;flex-direction:column;align-items:center;gap:0;flex-shrink:0">
          <div style="width:32px;height:32px;border-radius:50%;background:#0d1117;border:1px solid #334155;display:flex;align-items:center;justify-content:center;font-size:16px">${hTypeIcon(e.type)}</div>
          <div style="width:1px;flex:1;background:#1e293b;margin-top:4px;min-height:20px"></div>
        </div>
        <div style="flex:1;min-width:0;padding-bottom:8px">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap">
            <span style="font-size:12px;font-weight:600;color:#e2e8f0">${esc(e.title||hTypeLabel(e.type))}</span>
            <span style="font-size:10px;color:#475569">${e.date||''}</span>
            ${e.mood?`<span style="font-size:12px">${hMoodIcon(e.mood)}</span>`:''}
            <button onclick="deleteHistoryEntry(${cid},'${e.id}')" style="margin-left:auto;background:none;border:none;color:#334155;cursor:pointer;font-size:11px;padding:1px 5px;border-radius:4px" onmouseover="this.style.color='#dc2626'" onmouseout="this.style.color='#334155'">✕</button>
          </div>
          ${e.notes?`<div style="font-size:11px;color:#94a3b8;line-height:1.6;margin-bottom:5px;background:#080d1a;border-radius:6px;padding:7px 9px">${esc(e.notes)}</div>`:''}
          ${e.outcome?`<div style="font-size:11px;color:#34d399;background:#05966912;border:1px solid #05966930;border-radius:6px;padding:6px 9px;margin-bottom:5px">🎯 ${esc(e.outcome)}</div>`:''}
          ${e.nextAction?`<div style="font-size:11px;color:#60a5fa;background:#1e3a5f22;border:1px solid #3b82f640;border-radius:6px;padding:5px 9px">⚡ Договорились: ${esc(e.nextAction)}</div>`:''}
        </div>
      </div>`;
    }).join('');

  openM(`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <div class="av" style="width:36px;height:36px;font-size:13px;background:${lv(c.level).c}22;border-color:${lv(c.level).c};color:${lv(c.level).c};flex-shrink:0">${ini(c.name)}</div>
    <div style="flex:1"><div style="font-weight:700;font-size:14px">${esc(c.name)}</div><div style="font-size:11px;color:#64748b">История взаимодействий · ${hist.length} записей</div></div>
  </div>

  <!-- ADD ENTRY FORM -->
  <div style="background:#0d1117;border:1px solid #1e293b;border-radius:10px;padding:12px;margin-bottom:14px">
    <div style="font-size:10px;color:#818cf8;font-weight:600;margin-bottom:10px;letter-spacing:.5px">➕ ДОБАВИТЬ ЗАПИСЬ</div>
    <div class="g2" style="gap:8px">
      <div class="fld" style="margin:0"><label class="lbl">Тип</label><select id="h-type">${typeOpts}</select></div>
      <div class="fld" style="margin:0"><label class="lbl">Дата</label><input type="date" id="h-date" value="${tod()}"></div>
    </div>
    <div class="fld" style="margin-top:8px"><label class="lbl">Название / тема</label><input id="h-title" placeholder="Встреча в офисе, звонок по проекту..."></div>
    <div class="fld"><label class="lbl">О чём говорили / что произошло</label><textarea id="h-notes" rows="2" placeholder="Основные темы разговора, детали события..."></textarea></div>
    <div class="fld"><label class="lbl">🎯 Результат / договорённость</label><input id="h-outcome" placeholder="Договорились о встрече, согласовали условия..."></div>
    <div class="g2" style="gap:8px">
      <div class="fld" style="margin:0"><label class="lbl">⚡ Следующий шаг</label><input id="h-next" placeholder="Отправить КП, позвонить через неделю..."></div>
      <div class="fld" style="margin:0"><label class="lbl">Тон встречи</label><select id="h-mood">${moodOpts}</select></div>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="btn ba" onclick="saveHistoryEntry(${cid})">💾 Сохранить запись</button>
      <button class="btn bg sm" onclick="closeM()">Отмена</button>
    </div>
  </div>

  <!-- TIMELINE -->
  <div style="font-size:10px;color:#475569;font-weight:600;margin-bottom:10px;letter-spacing:.5px">📅 ХРОНОЛОГИЯ</div>
  <div style="max-height:50vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#1e293b transparent;padding-right:4px">
    ${timelineHtml}
  </div>`);
}

function saveHistoryEntry(cid){
  const title=gv('h-title').trim();
  const notes=gv('h-notes').trim();
  const outcome=gv('h-outcome').trim();
  const nextAction=gv('h-next').trim();
  const type=gv('h-type')||'other';
  const date=gv('h-date')||tod();
  const mood=gv('h-mood')||'good';
  if(!title&&!notes){notify('❌ Заполните хотя бы тему или заметки');return;}
  const entry={id:uid(),date,type,title,notes,outcome,nextAction,mood};
  S.contacts=S.contacts.map(c=>{
    if(c.id!==cid)return c;
    const history=[...(c.history||[]),entry];
    // Update lastContact date if newer
    const newLC=date>=(c.lastContact||'0')?date:c.lastContact;
    // If nextAction filled — set as new next step
    const na=nextAction||c.nextAction;
    return{...c,history,lastContact:newLC,nextAction:na};
  });
  save();notify('✅ Запись добавлена');closeM();render();
}

function deleteHistoryEntry(cid,eid){
  if(!confirm('Удалить эту запись?'))return;
  S.contacts=S.contacts.map(c=>c.id!==cid?c:{...c,history:(c.history||[]).filter(e=>e.id!==eid)});
  save();notify('🗑️ Удалено');closeM();render();
}

// "Шаг выполнен" → log it then clear or replace
function openCompleteStep(cid){
  const c=S.contacts.find(x=>x.id===cid);if(!c)return;
  const typeOpts=H_TYPES.map(t=>`<option value="${t.id}">${t.icon} ${t.label}</option>`).join('');
  const moodOpts=H_MOOD.map(m=>`<option value="${m.id}">${m.icon} ${m.label}</option>`).join('');
  openM(`<h3>✅ Шаг выполнен</h3>
  <div style="background:#0d3320;border:1px solid #05966944;border-radius:8px;padding:10px;margin-bottom:12px">
    <div style="font-size:11px;color:#64748b;margin-bottom:3px">Выполненный шаг:</div>
    <div style="font-size:13px;color:#34d399;font-weight:600">${esc(c.nextAction||'—')}</div>
    ${c.nextDate?`<div style="font-size:11px;color:#475569;margin-top:2px">планировалось: ${c.nextDate}</div>`:''}
  </div>
  <div class="g2" style="gap:8px">
    <div class="fld" style="margin:0"><label class="lbl">Тип события</label><select id="cs-type">${typeOpts}</select></div>
    <div class="fld" style="margin:0"><label class="lbl">Дата</label><input type="date" id="cs-date" value="${tod()}"></div>
  </div>
  <div class="fld"><label class="lbl">Как прошло? Что обсудили?</label><textarea id="cs-notes" rows="3" placeholder="Кратко опишите что произошло, о чём говорили..."></textarea></div>
  <div class="fld"><label class="lbl">🎯 Результат</label><input id="cs-outcome" placeholder="Что договорились, что решили..."></div>
  <div class="fld"><label class="lbl">⚡ Следующий шаг (новый)</label><input id="cs-next" placeholder="Оставьте пустым чтобы очистить..."></div>
  <div class="fld"><label class="lbl">Тон встречи</label><select id="cs-mood">${moodOpts}</select></div>
  <div style="display:flex;gap:8px;margin-top:8px">
    <button class="btn ba" onclick="completeStep(${cid})">💾 Зафиксировать</button>
    <button class="btn bg sm" onclick="closeM()">Отмена</button>
  </div>`);
}

function completeStep(cid){
  const c=S.contacts.find(x=>x.id===cid);if(!c)return;
  const date=gv('cs-date')||tod();
  const notes=gv('cs-notes').trim();
  const outcome=gv('cs-outcome').trim();
  const nextAction=gv('cs-next').trim();
  const type=gv('cs-type')||'meeting';
  const mood=gv('cs-mood')||'good';
  const entry={id:uid(),date,type,
    title:c.nextAction||'Выполненный шаг',
    notes,outcome,nextAction,mood,
    wasPlanned:true};
  S.contacts=S.contacts.map(x=>{
    if(x.id!==cid)return x;
    const history=[...(x.history||[]),entry];
    return{...x,history,lastContact:date,nextAction:nextAction||'',nextDate:''};
  });
  save();notify('✅ Шаг зафиксирован!');closeM();render();
}

// ══ BOOT ══════════════════════════════════════════════
stats();render();
</script>
